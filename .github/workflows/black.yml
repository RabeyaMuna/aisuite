name: formatting_check
run-name: Check code formatting

on: push

permissions:
  contents: read

jobs:
  formatting_check:
    runs-on: ubuntu-24.04

    services:
      pypi_wayback:
        image: ghcr.io/waleko/pypi-wayback
        ports:
        - 8629:8080

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Tox
      run: python -m pip install "tox==4.11.4"

    - name: Run formatting check
      run: python -m tox -e format_check

env:
  PIP_INDEX_URL: http://localhost:8629/2023-12-15
  UV_INDEX_URL: http://localhost:8629/2023-12-15
